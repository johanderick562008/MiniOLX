{# Shared by add_product.html and edit_product.html. `product` is None when adding. #}
<label>Product name
    <input name="name" required maxlength="120" value="{{ product.name if product else '' }}">
</label>
<label>Description
    <textarea name="description" required maxlength="2000" rows="5">{{ product.description if product else '' }}</textarea>
</label>
<div class="field-row">
    <label>Price (₹)
        <input name="price" type="number" required min="1" max="1000000" step="0.01"
               value="{{ product.price if product else '' }}">
    </label>
    <label>Quantity
        <input name="quantity" type="number" required min="{{ 0 if product else 1 }}" max="999" step="1"
               value="{{ product.quantity if product else 1 }}">
    </label>
</div>
<div class="field-row">
    <label>Category
        <select name="category" required>
            {% for value, label in CATEGORY_LABELS.items() %}
                <option value="{{ value }}" {{ 'selected' if product and product.category == value }}>{{ label }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Condition
        <select name="condition" required>
            {% for value, label in CONDITION_LABELS.items() %}
                <option value="{{ value }}" {{ 'selected' if product and product.condition == value }}>{{ label }}</option>
            {% endfor %}
        </select>
    </label>
</div>
<label>Photo
    <input name="image" type="file" accept="image/jpeg,image/png,image/webp" {{ '' if product else 'required' }}>
    <small>JPG, PNG or WEBP, up to 2 MB.{{ ' Leave empty to keep the current photo.' if product else '' }}</small>
</label>
<img id="image-preview" class="image-preview" alt="Photo preview"
     {% if product %}src="{{ product.image_url }}"{% else %}hidden{% endif %}>
